<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro Match</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:       #f5f4ef;   /* cool marble white   */
            --surface:  #ffffff;   /* paper               */
            --ink:      #14140f;   /* ink black           */
            --ink-soft: #3a3a32;   /* secondary text      */
            --muted:    #6e6b62;   /* tertiary text       */
            --stone:    #d8d4c8;   /* stone grey          */
            --accent:   #6b1f2e;   /* east-room wine red  */
        }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: "Cormorant Garamond", "Noto Serif KR", "Times New Roman", serif;
            font-size: 18px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        /* ── Doric column rules running down both edges ──────── */
        body::before,
        body::after {
            content: "";
            position: fixed;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--ink);
            opacity: 0.18;
            pointer-events: none;
            z-index: 1;
        }
        body::before { left:  36px; }
        body::after  { right: 36px; }

        /* ── Inscription style (Cinzel) ──────────────────────── */
        .eyebrow,
        .card__eyebrow,
        .profile__eyebrow,
        .aside__eyebrow {
            font-family: "Cinzel", "Noto Serif KR", serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.36em;
            text-transform: uppercase;
            color: var(--ink);
        }

        /* ── Top nav ────────────────────────────────────────── */
        .nav {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 32px;
            padding: 32px 72px 22px;
        }

        .nav__side {
            display: flex;
            gap: 32px;
            font-family: "Cinzel", serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        .nav__side--right { justify-content: flex-end; }

        .nav__side span {
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .nav__side span:hover { color: var(--accent); }

        .nav__brand {
            font-family: "Cinzel", serif;
            font-weight: 700;
            font-size: 26px;
            letter-spacing: 0.34em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* ── Pediment rule (heavy + thin) ─────────────────────── */
        .rule {
            border: none;
            position: relative;
            margin: 0 72px;
            height: 10px;
        }

        .rule::before,
        .rule::after {
            content: "";
            position: absolute;
            left: 0; right: 0;
            background: var(--ink);
        }

        .rule::before { top: 0;    height: 2px; }
        .rule::after  { bottom: 0; height: 1px; opacity: 0.45; }

        /* ── Layout ─────────────────────────────────────────── */
        .layout {
            flex: 1;
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 72px 72px 88px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 80px;
            position: relative;
            z-index: 2;
        }

        /* ── Profile header ─────────────────────────────────── */
        .profile {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        /* Square portrait frame (no rounding) */
        .profile__avatar {
            width: 108px;
            height: 108px;
            flex-shrink: 0;
            background: var(--surface);
            border: 1px solid var(--ink);
            box-shadow:
                0 0 0 5px var(--bg),
                0 0 0 6px var(--ink);
            display: grid;
            place-items: center;
            font-family: "Cinzel", "Noto Serif KR", serif;
            font-size: 44px;
            font-weight: 600;
            color: var(--ink);
        }

        .profile__meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .profile__name {
            font-family: "Cinzel", "Noto Serif KR", serif;
            font-size: 44px;
            font-weight: 600;
            line-height: 1.05;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .profile__handle {
            font-family: "Cinzel", serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ── Inscription divider (line · square · line) ─────── */
        .ornament {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 48px 0 36px;
            color: var(--ink);
        }

        .ornament__line {
            flex: 1;
            height: 1px;
            background: var(--ink);
            opacity: 0.45;
        }

        .ornament__mark {
            width: 7px;
            height: 7px;
            background: var(--ink);
        }

        /* ── Card (heavy ink rules top & bottom) ────────────── */
        .card {
            background: var(--surface);
            border-top:    2px solid var(--ink);
            border-bottom: 2px solid var(--ink);
            padding: 36px 40px;
        }

        .card__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 18px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--ink);
            position: relative;
        }

        .card__header::after {
            content: "";
            position: absolute;
            left: 0; right: 0;
            bottom: -4px;
            height: 1px;
            background: var(--ink);
            opacity: 0.4;
        }

        .card__actions {
            display: flex;
            gap: 10px;
        }

        /* ── 자기소개 편집 textarea ───────────────────────────── */
        .about__edit {
            width: 100%;
            min-height: 160px;
            padding: 14px 16px;
            border: 1px solid var(--ink);
            background: var(--bg);
            color: var(--ink);
            font-family: inherit;
            font-size: 17px;
            line-height: 1.7;
            resize: vertical;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .about__edit:focus { border-color: var(--accent); }

        .btn[disabled]   { opacity: 0.5; cursor: wait; }

        /* ── Buttons (square, ink) ──────────────────────────── */
        .btn {
            font-family: "Cinzel", serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            padding: 11px 22px;
            border: 1px solid var(--ink);
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
        }

        .btn--ghost { /* default */ }
        .btn--ghost:hover {
            background: var(--ink);
            color: var(--surface);
        }

        .btn--primary {
            background: var(--ink);
            color: var(--surface);
        }

        .btn--primary:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn--sm {
            padding: 7px 14px;
            font-size: 10px;
            letter-spacing: 0.24em;
        }

        /* ── Aside (recommendation column) ──────────────────── */
        .aside {
            position: sticky;
            top: 32px;
            align-self: start;
            max-height: calc(100vh - 64px);
            overflow-y: auto;
        }

        .aside__header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 18px;
            margin-bottom: 4px;
            border-bottom: 2px solid var(--ink);
        }

        .aside__heading {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .aside__sub {
            font-family: "Cormorant Garamond", "Noto Serif KR", serif;
            font-size: 14px;
            font-style: italic;
            color: var(--muted);
        }

        .match-list { list-style: none; }

        .match-item {
            display: flex;
            gap: 16px;
            padding: 20px 4px;
            border-bottom: 1px solid var(--ink);
            cursor: pointer;
            transition: background 0.18s ease;
        }

        .match-item:last-child { border-bottom: 1px solid var(--ink); }

        .match-item:hover {
            background: rgba(20, 20, 15, 0.04);
        }

        .match-item__avatar {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            background: var(--surface);
            border: 1px solid var(--ink);
            display: grid;
            place-items: center;
            font-family: "Cinzel", "Noto Serif KR", serif;
            font-size: 19px;
            font-weight: 600;
            color: var(--ink);
        }

        .match-item__body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .match-item__name {
            font-family: "Cinzel", "Noto Serif KR", serif;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .match-item__intro {
            font-family: "Cormorant Garamond", "Noto Serif KR", serif;
            font-size: 14.5px;
            line-height: 1.55;
            color: var(--ink-soft);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ── Footer ─────────────────────────────────────────── */
        .footer {
            margin-top: auto;
            padding: 28px 24px;
            border-top: 2px solid var(--ink);
            font-family: "Cinzel", serif;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.36em;
            text-transform: uppercase;
            color: var(--ink-soft);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .footer span + span::before {
            content: "·";
            margin: 0 16px;
            color: var(--ink);
        }

        /* ── Responsive ─────────────────────────────────────── */
        @media (max-width: 960px) {
            body::before,
            body::after { display: none; }

            .nav   { padding: 24px 28px 14px; gap: 18px; }
            .rule  { margin: 0 28px; }

            .layout {
                grid-template-columns: 1fr;
                gap: 56px;
                padding: 52px 28px 64px;
            }

            .aside {
                position: static;
                max-height: none;
                overflow: visible;
            }

            .profile__name   { font-size: 34px; letter-spacing: 0.10em; }
            .profile__avatar { width: 88px; height: 88px; font-size: 36px; }
            .card            { padding: 28px 26px; }
        }

        @media (max-width: 600px) {
            .nav {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 14px;
            }
            .nav__side        { justify-content: center; gap: 22px; }
            .nav__side--right { order: 3; }
            .nav__brand       { order: 2; font-size: 20px; letter-spacing: 0.30em; }

            .profile          { flex-direction: column; text-align: center; gap: 22px; }
            .card__header     { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<!-- ── NAV ──────────────────────────────────────────────────── -->
<header class="nav">
    <nav class="nav__side nav__side--left">
        <span>About</span>
        <span>Members</span>
    </nav>
    <div class="nav__brand">Intro Match</div>
    <nav class="nav__side nav__side--right">
        <span>My Page</span>
        <span>Settings</span>
    </nav>
</header>

<hr class="rule">

<!-- ── BODY ─────────────────────────────────────────────────── -->
<main class="layout">

    <!-- MAIN COLUMN -->
    <section class="main">

        <!-- Profile header -->
        <header class="profile">
            <div class="profile__avatar" id="profileAvatar">·</div>
            <div class="profile__meta">
                <p class="profile__eyebrow" id="profileEyebrow">Member · No. ―</p>
                <h1 class="profile__name" id="profileName">―</h1>
                <p class="profile__handle" id="profileHandle">@user_―</p>
            </div>
        </header>

        <!-- Ornament divider -->
        <div class="ornament" aria-hidden="true">
            <span class="ornament__line"></span>
            <span class="ornament__mark"></span>
            <span class="ornament__line"></span>
        </div>

        <!-- About me card -->
        <section class="card about">
            <header class="card__header">
                <p class="card__eyebrow">About Me</p>
                <div class="card__actions">
                    <button id="saveBtn" class="btn btn--primary" type="button">Save</button>
                </div>
            </header>
            <textarea id="introInput" class="about__edit" placeholder="자기소개를 작성하세요..."></textarea>
        </section>

    </section>

    <!-- ASIDE COLUMN -->
    <aside class="aside">
        <header class="aside__header">
            <div class="aside__heading">
                <p class="aside__eyebrow">People You Might Match</p>
                <p class="aside__sub">AI가 골라드린 분들입니다.</p>
            </div>
        </header>

        <ul class="match-list">
            <li class="match-item">
                <div class="match-item__avatar">…</div>
                <div class="match-item__body">
                    <p class="match-item__name">불러오는 중</p>
                    <p class="match-item__intro">잠시만 기다려 주세요.</p>
                </div>
            </li>
        </ul>
    </aside>

</main>
<!-- ── FOOTER ───────────────────────────────────────────────── -->
<footer class="footer">
    <span>The Intro Match</span>
    <span>Anno MMXXVI</span>
    <span>Powered by AI</span>
</footer>

<script src="/js/intro.js"></script>
</body>
</html>
